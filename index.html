<style>
:root{
  --bg: #EEF0E4;
  --paper: #FBFBF6;

  --font-body: -apple-system, 'Segoe UI', Roboto, sans-serif;

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);

  -webkit-tap-highlight-color:transparent;
}
header.app-head{
  background:var(--marsh);

}

}

  border:1px solid #1f3a2c;
}

<script>
/* ===================== Config & helpers ===================== */
const RATING3 = ['-','+/-','+'];
const RATING4 = ['--','-','+/-','+'];
const RATINGND = ['-','+/-','+','Nd'];
const ACT_LEVELS = [['','—'],['princ','Princ'],['2nd','2°'],['cplt','Cplt']];

function slug(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(k=>{ if(k) e.appendChild(typeof k==='string'?document.createTextNode(k):k); });
  return e;
}

/* ===================== Data model ===================== */
let record = {}; // current in-progress record (flat key/value)
let editingId = null;

function setVal(key, val){ record[key] = val; saveDraft(); }
function getVal(key){ return record[key]; }

function saveDraft(){ localStorage.setItem('zh_draft', JSON.stringify(record)); }
function loadDraft(){
  try{ record = JSON.parse(localStorage.getItem('zh_draft')||'{}'); }catch(e){ record = {}; }
}

function getRecords(){
  try{ return JSON.parse(localStorage.getItem('zh_records')||'[]'); }catch(e){ return []; }
}
function setRecords(list){ localStorage.setItem('zh_records', JSON.stringify(list)); updateRecCount(); }
function updateRecCount(){ document.getElementById('recCount').textContent = getRecords().length; }

/* ===================== Species lists ===================== */
const SP_NON_HUMIDE = ["Acer campestre","Acer pseudoplatanus","Achillea millefolium","Alopecurus pratensis","Arrhenatherum elatius","Bromus hordeaceus","Cirsium arvense","Clematis vitalba","Cornus sanguinea","Corylus avellana","Crataegus monogyna","Dactylis glomerata","Daucus carota","Fraxinus excelsior","Galium aparine","Geum urbanum","Hedera helix","Heracleum sphondylium","Schedonorus pratensis","Lolium perenne","Lotus corniculatus","Plantago lanceolata","Poa annua","Poa trivialis","Prunus spinosa","Quercus petraea","Quercus robur","Ranunculus acris","Ranunculus bulbosus","Rubus pruinosus","Rubus sp.","Rumex acetosa","Rumex crispus","Sambucus nigra","Torilis arvensis","Trifolium pratense","Trifolium repens","Urtica dioica"];

  "grp3_amphibies":{ title:"Groupe 3 — Amphibies & roselières", species:["Cyperus fuscus","Deschampsia cespitosa","Eleocharis acicularis","Eleocharis palustris","Epilobium hirsutum","Epilobium parviflorum","Equisetum fluviatile","Equisetum palustre","Eupatorium cannabinum","Filipendula ulmaria","Galium debile","Galium palustre","Galium uliginosum","Glyceria fluitans","Glyceria maxima","Helosciadium nodiflorum","Humulus lupulus","Impatiens glandulifera","Iris pseudacorus","Juncus acutiflorus","Juncus articulatus","Juncus conglomeratus"]},

const TEXTURE_FRACTIONS = ['Sable','Limon','Argile'];
const TEXTURE_PREFIX = {Sable:'sablo', Argile:'argilo', Limon:'limono'};
const TEXTURE_FINAL = {Sable:'sableux', Argile:'argileux', Limon:'limoneux'};

/* ===================== Lambert-93 (EPSG:2154) — formules officielles IGN/EPSG méthode 9802 ===================== */
/* Ellipsoïde GRS80, paramètres officiels: lat_0=46.5 lon_0=3 lat_1=49 lat_2=44 x_0=700000 y_0=6600000 */
const L93_A = 6378137.0;
const L93_E = 0.0818191910428158;
const L93_LAMBDA0 = 3 * Math.PI/180;
const L93_PHI0 = 46.5 * Math.PI/180;
const L93_PHI1 = 44 * Math.PI/180;
const L93_PHI2 = 49 * Math.PI/180;
const L93_X0 = 700000;
const L93_Y0 = 6600000;
function l93_t(phi, e){ return Math.tan(Math.PI/4 - phi/2) / Math.pow((1 - e*Math.sin(phi)) / (1 + e*Math.sin(phi)), e/2); }
function l93_m(phi, e){ return Math.cos(phi) / Math.sqrt(1 - e*e*Math.sin(phi)*Math.sin(phi)); }
const L93_M1 = l93_m(L93_PHI1, L93_E), L93_M2 = l93_m(L93_PHI2, L93_E);
const L93_T0 = l93_t(L93_PHI0, L93_E), L93_T1 = l93_t(L93_PHI1, L93_E), L93_T2 = l93_t(L93_PHI2, L93_E);
const L93_N = (Math.log(L93_M1) - Math.log(L93_M2)) / (Math.log(L93_T1) - Math.log(L93_T2));
const L93_F = L93_M1 / (L93_N * Math.pow(L93_T1, L93_N));
const L93_RHO0 = L93_A * L93_F * Math.pow(L93_T0, L93_N);

function wgs84ToL93(latDeg, lonDeg){
  const phi = latDeg * Math.PI/180, lambda = lonDeg * Math.PI/180;
  const t = l93_t(phi, L93_E);
  const rho = L93_A * L93_F * Math.pow(t, L93_N);
  const theta = L93_N * (lambda - L93_LAMBDA0);
  return { x: L93_X0 + rho*Math.sin(theta), y: L93_Y0 + L93_RHO0 - rho*Math.cos(theta) };
}
function l93ToWgs84(x, y){
  const dx = x - L93_X0, dy = L93_RHO0 - (y - L93_Y0);
  const rho = Math.sqrt(dx*dx + dy*dy);
  const theta = Math.atan2(dx, dy);
  const lambda = theta/L93_N + L93_LAMBDA0;
  const t = Math.pow(rho/(L93_A*L93_F), 1/L93_N);
  let phi = Math.PI/2 - 2*Math.atan(t);
  for(let i=0;i<12;i++){ phi = Math.PI/2 - 2*Math.atan(t * Math.pow((1-L93_E*Math.sin(phi))/(1+L93_E*Math.sin(phi)), L93_E/2)); }
  return { lat: phi*180/Math.PI, lon: lambda*180/Math.PI };
}

/* ===================== Référentiels externes (CORINE Biotopes, catalogue flore) — importables, non inventés ===================== */
function getCorineReferentiel(){
  try{ return JSON.parse(localStorage.getItem('zh_corine_ref')||'[]'); }catch(e){ return []; }
}
function setCorineReferentiel(list){ localStorage.setItem('zh_corine_ref', JSON.stringify(list)); }

/* ===================== Generic field renderers ===================== */
function fieldWrap(label, hint, node){
  const w = el('div',{class:'field'});
  if(label) w.appendChild(el('label',{},label));
  w.appendChild(node);
  if(hint) w.appendChild(el('div',{class:'hint'},hint));
  return w;
}

function inputText(key, label, opts={}){
  const i = el('input',{type: opts.type||'text', id:key});
  if(opts.type==='number'){ if(opts.min!=null)i.min=opts.min; if(opts.max!=null)i.max=opts.max; }
  i.value = getVal(key)||'';
  i.addEventListener('input', ()=>setVal(key, i.value));
  return fieldWrap(label, opts.hint, i);
}

function textarea(key, label){
  const t = el('textarea',{id:key});
  t.value = getVal(key)||'';
  t.addEventListener('input', ()=>setVal(key, t.value));
  return fieldWrap(label, null, t);
}

function pillRadio(key, label, options, styleClass=''){
  const wrap = el('div',{class:'pillgroup'});
  function refresh(){
    wrap.querySelectorAll('.pill').forEach(p=>{
      p.classList.toggle('sel', p.dataset.v === (getVal(key)||''));
    });
  }
  options.forEach(opt=>{
    const p = el('span', {class:'pill '+styleClass}, opt);
    p.dataset.v = opt;
    p.addEventListener('click', ()=>{ setVal(key, getVal(key)===opt?'':opt); refresh(); });
    wrap.appendChild(p);
  });
  refresh();
  return fieldWrap(label, null, wrap);
}

function checkGroup(key, label, options, cols=2){
  const wrap = el('div',{class:'checklist'});
  wrap.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  const arr = new Set(getVal(key)||[]);
  options.forEach(opt=>{
    const id = key+'_'+slug(opt);
    const cb = el('input',{type:'checkbox', id});
    cb.checked = arr.has(opt);
    cb.addEventListener('change', ()=>{
      if(cb.checked) arr.add(opt); else arr.delete(opt);

function locate(){
  const chip = document.getElementById('gpsChip');
  const txt = document.getElementById('gpsText');
  txt.textContent = 'Localisation en cours…';
  if(!navigator.geolocation){ txt.textContent='GPS indisponible sur cet appareil'; return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const l93 = wgs84ToL93(pos.coords.latitude, pos.coords.longitude);
    const x = l93.x.toFixed(2), y = l93.y.toFixed(2);
    setVal('x_l93', x); setVal('y_l93', y); setVal('gps_precision', Math.round(pos.coords.accuracy));
    chip.classList.add('live');
    txt.textContent = `X ${x} / Y ${y} (L93, ±${Math.round(pos.coords.accuracy)} m)`;
    const xF = document.getElementById('f_x_l93'); if(xF) xF.value = x;
    const yF = document.getElementById('f_y_l93'); if(yF) yF.value = y;
    const inline = document.getElementById('gpsInline'); if(inline) inline.textContent = `X ${x} / Y ${y}`;
  }, err=>{
    txt.textContent = 'Échec localisation — ' + err.message;
  }, {enableHighAccuracy:true, timeout:15000});
}

function computeTextureLabel(prim, sec, ter){
  const parts = [prim, sec, ter].filter(p=>p && p!=='Aucun');
  if(parts.length===0) return '';
  if(parts.length===1) return TEXTURE_FINAL[parts[0]].charAt(0).toUpperCase()+TEXTURE_FINAL[parts[0]].slice(1);
  const prefixes = parts.slice(0,-1).map(p=>TEXTURE_PREFIX[p]);
  const last = TEXTURE_FINAL[parts[parts.length-1]];
  const raw = prefixes.join('-')+'-'+last;
  return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function renderPedologieBody(container){

      const i = el('input',{type:type||'number'});
      i.value = s[key]||'';

    ['nappe','histique','reductique','redoxique'].forEach(param=>{

    });

    box.appendChild(sField(s, 'profondeur_totale', 'Profondeur totale du sondage (cm)'));

    box.appendChild(el('h3',{},'Texture (ordre significatif)'));
    const texRow = el('div',{class:'twocol'});

      const sel = el('select',{});
      options.forEach(o=>{ const op=el('option',{value:o}, o||'—'); if(s[key]===o) op.selected=true; sel.appendChild(op); });
      sel.addEventListener('change', ()=>{
        // empêcher une même fraction sélectionnée deux fois
        const others = ['texture_primaire','texture_secondaire','texture_tertiaire'].filter(k=>k!==key).map(k=>s[k]);
        if(sel.value && sel.value!=='Aucun' && others.includes(sel.value)){
          toast('Cette fraction est déjà utilisée');
          sel.value = s[key]||'';
          return;
        }
        s[key] = sel.value;
        s.texture_label = computeTextureLabel(s.texture_primaire, s.texture_secondaire, s.texture_tertiaire);
        setSondages(sondages);
        labelBox.textContent = s.texture_label || '(à définir)';
      });

    }
    texRow.appendChild(textureSelect(s,'texture_primaire', TEXTURE_FRACTIONS, 'Primaire'));
    texRow.appendChild(textureSelect(s,'texture_secondaire', [...TEXTURE_FRACTIONS,'Aucun'], 'Secondaire'));

  const fileInput = el('input',{type:'file', accept:'.json', style:'display:none;'});
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error('format');
        setCorineReferentiel(data);
        toast('Référentiel CORINE importé ('+data.length+' entrées)');
        renderCorineBlock(container);
      }catch(err){ toast('Fichier invalide — attendu : [{"code":"...","libelle":"..."}]'); }
    };
    reader.readAsText(file);
  });
  fileLabel.appendChild(fileInput);
  container.appendChild(fileLabel);

  const searchInput = el('input',{type:'text', placeholder:'Rechercher par code ou intitulé…'});
  container.appendChild(fieldWrap('Rechercher dans le référentiel', null, searchInput));
  const results = el('div',{});
  container.appendChild(results);

  const searchRow = el('div',{class:'searchrow', style:'margin-top:10px;'});
  const codeInput = el('input',{type:'text', placeholder:'Code', style:'max-width:100px;'});
  const libelleInput = el('input',{type:'text', placeholder:'Libellé (auto si trouvé, sinon à saisir)'});
  searchRow.appendChild(codeInput);
  searchRow.appendChild(libelleInput);
  container.appendChild(searchRow);

  searchInput.addEventListener('input', ()=>{
    results.innerHTML = '';
    const q = searchInput.value.trim().toLowerCase();
    if(!q || ref.length===0) return;
    ref.filter(r=>(r.code||'').toLowerCase().includes(q) || (r.libelle||'').toLowerCase().includes(q)).slice(0,8).forEach(r=>{
      const item = el('div',{class:'chk', style:'cursor:pointer;'}, r.code+' — '+r.libelle);
      item.addEventListener('click', ()=>{ codeInput.value = r.code; libelleInput.value = r.libelle; searchInput.value=''; results.innerHTML=''; });
      results.appendChild(item);
    });
  });

  const addBtn = el('button',{class:'btn btn-primary', type:'button', style:'margin-top:6px;'}, '+ Ajouter cet habitat');
  addBtn.addEventListener('click', ()=>{
    if(!codeInput.value.trim()){ toast('Renseigner au moins un code'); return; }
    const list = getVal('corine_habitats')||[];
    list.push({code:codeInput.value.trim(), libelle:libelleInput.value.trim()});
    setVal('corine_habitats', list);
    codeInput.value=''; libelleInput.value='';
    renderCorineBlock(container);
  });
  container.appendChild(addBtn);

  const tags = el('div',{class:'taglist', style:'margin-top:10px;'});
  habitats.forEach((h,idx)=>{
    const tag = el('span',{class:'tag'}, h.code+(h.libelle?' — '+h.libelle:''));
    const rm = el('button',{type:'button'}, '×');
    rm.addEventListener('click', ()=>{
      const list = getVal('corine_habitats')||[];
      list.splice(idx,1);
      setVal('corine_habitats', list);
      renderCorineBlock(container);
    });
    tag.appendChild(rm);
    tags.appendChild(tag);
  });
  container.appendChild(tags);
}

  const corineBox = el('div',{});
  card.appendChild(corineBox);
  renderCorineBlock(corineBox);

  card.appendChild(el('h2',{},'Cortège floristique'));
  card.appendChild(el('div',{class:'hint'},'Cocher les espèces observées. % de recouvrement par groupe hygrophile.'));
  Object.entries(SP_GROUPS).forEach(([id,g])=>{
    card.appendChild(speciesBlock(id, g.title, g.species));
  });
  card.appendChild(el('h3',{},'Cortège non humide'));
  card.appendChild(el('div',{class:'hint'},'Touche ★ pour signaler une espèce particulièrement abondante.'));

  sageSel.appendChild(el('option',{value:''},'— Sélectionner —'));

/* ===================== Rendering / navigation ===================== */
function renderAll(){
  const tabsEl = document.getElementById('tabs');
  const secEl = document.getElementById('sections');
  tabsEl.innerHTML = ''; secEl.innerHTML = '';
  SECTIONS.forEach((s,i)=>{
    const btn = el('button',{}, s.title);
    btn.addEventListener('click', ()=>showSection(s.id));
    btn.dataset.id = s.id;
    tabsEl.appendChild(btn);

    const sec = el('div',{class:'section', id:'sec_'+s.id});
    const card = el('div',{class:'card'});
    s.build(card);
    sec.appendChild(card);
    secEl.appendChild(sec);
  });
  showSection(SECTIONS[0].id);
}
function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id==='sec_'+id));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  window.scrollTo({top:0, behavior:'instant'});
}

/* ===================== Save / records / export ===================== */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function saveRecord(){
  const list = getRecords();
  const now = new Date().toISOString();
  const rec = Object.assign({}, record, {
    _id: editingId || ('zh_'+Date.now()),
    _saved_at: now
  });
  if(editingId){
    const idx = list.findIndex(r=>r._id===editingId);
    if(idx>-1) list[idx] = rec; else list.push(rec);
  } else {
    list.push(rec);
  }
  setRecords(list);
  editingId = rec._id;
  toast('Fiche enregistrée ('+list.length+' au total)');
}

function newRecord(){
  record = {}; editingId = null;
  localStorage.removeItem('zh_draft');
  renderAll();
  document.getElementById('gpsChip').classList.remove('live');
  document.getElementById('gpsText').textContent = 'GPS non localisé';
  toast('Nouvelle fiche vierge');
}

function openRecordsModal(){
  const list = getRecords();
  const box = document.getElementById('recordsList');
  box.innerHTML = '';
  if(list.length===0){ box.appendChild(el('p',{},'Aucune fiche enregistrée pour le moment.')); }
  list.slice().reverse().forEach(r=>{
    const row = el('div',{class:'recordrow'});
    const label = (r.identifiant || r._id) + ' — ' + (r.conclusion_zh||'?');
    const meta = (r.x_l93&&r.y_l93)? `X ${r.x_l93}, Y ${r.y_l93}` : 'sans coord.';
    row.appendChild(el('div',{}, el('div',{},label), el('div',{class:'rmeta'}, meta+' · '+new Date(r._saved_at).toLocaleString('fr-FR'))));
    const actions = el('div',{style:'display:flex; gap:6px;'});
    const editBtn = el('button',{class:'btn btn-outline', type:'button'},'Ouvrir');
    editBtn.addEventListener('click', ()=>{ record = Object.assign({}, r); editingId = r._id; renderAll(); closeModal(); if(r.x_l93) document.getElementById('gpsText').textContent = 'X '+r.x_l93+' / Y '+r.y_l93; toast('Fiche chargée'); });
    const delBtn = el('button',{class:'btn btn-danger', type:'button'},'Suppr.');
    delBtn.addEventListener('click', ()=>{
      if(confirm('Supprimer cette fiche ?')){
        setRecords(getRecords().filter(x=>x._id!==r._id));
        openRecordsModal();
      }
    });
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    box.appendChild(row);
  });
  document.getElementById('recordsModal').classList.add('show');
}
function closeModal(){ document.getElementById('recordsModal').classList.remove('show'); }

function download(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function exportGeojson(){
  const list = getRecords();
  const features = list.map(r=>{
    let geom = null;
    if(r.x_l93 && r.y_l93){
      const wgs = l93ToWgs84(parseFloat(r.x_l93), parseFloat(r.y_l93));
      geom = {type:'Point', coordinates:[wgs.lon, wgs.lat]};
    }
    return {
      type:'Feature',
      geometry: geom,
      properties: Object.fromEntries(Object.entries(r).map(([k,v])=>[k, Array.isArray(v)?JSON.stringify(v):v]))
    };
  });
  const fc = {type:'FeatureCollection', name:'zones_humides', crs:{type:'name', properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}}, features};
  download('zones_humides_'+Date.now()+'.geojson', JSON.stringify(fc, null, 2), 'application/geo+json');
  toast('Export GeoJSON téléchargé (géométrie WGS84, X/Y L93 en attribut)');
}

function exportCsv(){
  const list = getRecords();
  if(list.length===0){ toast('Aucune fiche à exporter'); return; }
  const keys = Array.from(list.reduce((set,r)=>{ Object.keys(r).forEach(k=>set.add(k)); return set; }, new Set()));
  const rows = [keys.join(';')];
  list.forEach(r=>{
    rows.push(keys.map(k=>{
      let v = r[k];
      if(Array.isArray(v)) v = v.join(' | ');
      if(v==null) v = '';
      v = String(v).replace(/;/g,',').replace(/\n/g,' ');
      return v;
    }).join(';'));
  });
  download('zones_humides_'+Date.now()+'.csv', rows.join('\n'), 'text/csv');
  toast('Export CSV téléchargé');
}

/* ===================== Init ===================== */
document.getElementById('btnSave').addEventListener('click', saveRecord);
document.getElementById('btnNew').addEventListener('click', ()=>{ if(confirm('Repartir sur une fiche vierge ? La fiche en cours non enregistrée sera perdue.')) newRecord(); });
document.getElementById('btnRecords').addEventListener('click', openRecordsModal);
document.getElementById('btnCloseModal').addEventListener('click', closeModal);
document.getElementById('btnExportGeojson').addEventListener('click', exportGeojson);
document.getElementById('btnExportCsv').addEventListener('click', exportCsv);

renderAll();
updateRecCount();
if(getVal('x_l93') && getVal('y_l93')){
  document.getElementById('gpsChip').classList.add('live');
  document.getElementById('gpsText').textContent = 'X '+getVal('x_l93')+' / Y '+getVal('y_l93');
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{/* offline install needs https hosting */});
  });
}
